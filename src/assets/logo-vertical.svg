<svg width="320" height="220" viewBox="0 0 320 220" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>GymPulse logo verticale</title>

  <!-- Barra centrale centrata -->
  <rect x="124" y="58" width="72" height="14" rx="3" fill="#ff6b00"/>

  <!-- LATO SINISTRO -->
  <rect x="106" y="20" width="18" height="90" rx="4" fill="#ff6b00"/>
  <rect x="88" y="33" width="18" height="64" rx="3" fill="#ff6b00"/>
  <rect x="72" y="45" width="16" height="40" rx="3" fill="#ff6b00"/>

  <!-- LATO DESTRO -->
  <rect x="196" y="20" width="18" height="90" rx="4" fill="#ff6b00"/>
  <rect x="214" y="33" width="18" height="64" rx="3" fill="#ff6b00"/>
  <rect x="232" y="45" width="16" height="40" rx="3" fill="#ff6b00"/>

  <!-- Frequenza cardiaca -->
  <polyline
    points="124,65 132,65 138,35 148,95 156,49 164,81 170,65 196,65"
    stroke="white"
    stroke-width="4"
    fill="none"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Testo centrato sotto con più spazio -->
  <text
    x="165"
    y="185"
    font-family="'Bebas Neue', sans-serif"
    font-size="52"
    letter-spacing="4"
    text-anchor="middle">
    <tspan fill="#ff6b00">GYM</tspan><tspan fill="white">PULSE</tspan>
  </text>
</svg>